      <h1>대한민국 수도 관련 시험 기사</h1>
      <p>대한민국의 수도는 서울이다. 이 문장은 Fact Lens의 팩트체크 경로를 검증하기 위해 작성된 단일 핵심 주장이다.</p>
      <p>서울은 대한민국의 정치와 행정 기능이 집중된 도시다. 이 시험 문서는 기사 추출, 주장 분석, 웹 검색 기반 검증, 결과 저장과 화면 표시가 끝까지 이어지는지 자동으로 확인하기 위한 고정 입력이다.</p>
      <p>문서 길이는 기사 본문 추출기의 최소 기준을 넘도록 구성했으며 광고, 메뉴, 댓글 같은 불필요한 요소는 포함하지 않았다.</p>
    </article>
