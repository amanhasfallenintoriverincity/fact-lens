<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fact Lens 설정</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      width: 500px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    .label-description {
      font-weight: normal;
      color: #666;
      font-size: 12px;
      margin-left: 5px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .help-text {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .help-text a {
      color: #667eea;
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .primary-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .secondary-btn {
      background: #f0f0f0;
      color: #333;
    }

    .secondary-btn:hover {
      background: #e0e0e0;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .warning-box {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 4px;
    }

    .warning-box strong {
      color: #856404;
    }

    .warning-box p {
      margin-top: 5px;
      font-size: 13px;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Fact Lens 설정</h1>
    <p class="subtitle">API 키를 입력하여 Fact Lens를 활성화하세요</p>

    <div id="successMessage" class="success-message">
      ✅ 설정이 저장되었습니다!
    </div>

    <div class="warning-box">
      <strong>⚠️ 중요:</strong> API 키는 브라우저에 안전하게 저장되며, 외부로 전송되지 않습니다.
    </div>

    <form id="settingsForm">
      <div class="form-group">
        <label>
          Google Gemini API Key
          <span class="label-description">(필수)</span>
        </label>
        <input type="password" id="geminiKey" placeholder="AIza..." required>
        <div class="help-text">
          <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>에서 무료 API 키를 발급받으세요.
          <br>Gemma 4 31B 모델 사용 (무료)
        </div>
      </div>

      <div class="form-group">
        <label>
          KOSIS API Key
          <span class="label-description">(선택)</span>
        </label>
        <input type="text" id="kosisKey" placeholder="KOSIS API 키 (없어도 사용 가능)">
        <div class="help-text">
          <a href="https://kosis.kr/openapi/" target="_blank">KOSIS OpenAPI</a>에서 무료 API 키를 발급받으세요.
          <br>통계 관련 주장 검증에 사용됩니다.
        </div>
      </div>

      <div class="button-group">
        <button type="button" class="secondary-btn" id="cancelBtn">취소</button>
        <button type="submit" class="primary-btn">저장</button>
      </div>
    </form>
  </div>

  <script src="./options.js"></script>
</body>
</html>
